<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviônicos - Boreal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="compra.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="top-bar">
            <div class="back-nav">
                <button class="btn-back">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="page-title">AVIONICOS</h1>
            </div>
            <div class="user-actions">
                <div class="icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    <span class="notification-badge">1</span>
                </div>
                <div class="icon-wrapper">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>
        </header>

        <div class="content">
            <div class="nav-cards">
                <div class="nav-card">
                 <a href="Manutenção (1).html"><i class="fa-solid fa-gear"></i></a>
                    <span>Manutenção</span>
                    
                </div>
                <div class="nav-card active">
                    <i class="fa-solid fa-puzzle-piece"></i>
                    <span>Peças</span>
                </div>
                
            </div>

            <div class="section-header">
                <div class="tagline">Aviônicos</div>
                <h1 class="main-heading">
                    Itens com
                    <span class="highlight-text">Excelência Boreal</span>
                </h1>
            </div>

            <div class="divider"></div>

            <div class="details-card">
                <div class="detail-row">
                    <span class="detail-label">Item</span>
                    <span class="detail-value">Freio de Carbono</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Aeronave</span>
                    <span class="detail-value">Universal</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Prazo estimado</span>
                    <span class="detail-value">14 a 21 dias</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Endereço</span>
                    <span class="detail-value highlight-blue">Hangar Boreal · POA</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total</span>
                    <span class="detail-value highlight-price">R$ 45.000</span>
                </div>
            </div>

            <a href="comprado.html"><button class="btn-agendar">Agendar Item</button></a>
        </div>
    </div>

</body>
</html>
