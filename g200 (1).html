<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G200</title>
    <link rel="stylesheet" href="400xp2.css">
</head>
<body>

    <header class="header">
        <div class="top-bar">
            <div class="back-nav">
                <button class="btn-back">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="page-title">G200</h1>
            </div>
            <div class="user-actions">
                <div class="icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    <span class="notification-badge">1</span>
                </div>
                <div class="icon-wrapper">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="toggle-container">
            <a href="g200 (2).html"><button class="toggle-btn active">ALUGAR</button></a>
            <button class="toggle-btn">COMPRAR</button>
        </div>

        <section class="card-details">
            <div class="detail-row">
                <span class="label">Origem</span>
                <span class="value value-blue">Porto Alegre (POA)</span>
            </div>
            <div class="detail-row">
                <span class="label">Destino</span>
                <span class="value value-blue">São Paulo (CGH)</span>
            </div>
            <div class="detail-row">
                <span class="label">Data de embarque</span>
                <span class="value">04 abr 2026 - 09:30</span>
            </div>
            <div class="detail-row">
                <span class="label">Passageiros</span>
                <span class="value">4 executivos</span>
            </div>
            <div class="detail-row">
                <span class="label">Tempo de percurso</span>
                <span class="value">1h 20min</span>
            </div>
        </section>

        <section class="card-pricing">
            <div class="price-row">
                <span>Aeronave</span>
                <span>R$ 27MI</span>
            </div>
            <div class="price-row">
                <span>Taxas de pouso</span>
                <span>R$ 1.240</span>
            </div>
            <div class="price-row">
                <span>Tripulação e catering</span>
                <span>R$ 950</span>
            </div>
            <div class="pricing-divider"></div>
            <div class="price-row total-row">
                <span class="total-label">TOTAL ESTIMADO</span>
                <span class="total-value">R$ 27MI</span>
            </div>
        </section>

        <a href="comprado.html"><button class="btn-confirm">CONFIRMAR COMPRA</button></a>

    </main>

</body>
</html>
