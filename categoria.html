<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias de Peças</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="categoria.css">
</head>
<body>

    <div class="screen">
     
        <header>
            <div class="header-left">

            <div class="header-actions">

                    <i class="fa-regular fa-envelope"></i>

                </div>
                <div class="icon-btn">
                    <a href="login.html"><i class="fa-regular fa-user"></i></a>
                </div>
            </div>
        </header>

                <div class="tab-card">
                    <i class="fa-solid fa-gear"></i>

                </div>

            <div class="divider"></div>

                    <div class="card-left">
                        <div class="image-placeholder"></div>

                        </div>
                    </div>
                    <a href="avionicos.html" class="btn-explore">Explorar</a>
                </div>

              
                <div class="category-card">
                    <div class="card-left">
                        <div class="image-placeholder"></div>

                        </div>
                    </div>
                    <a href="#" class="btn-explore">Explorar</a>
                </div>

                
                <div class="category-card">
                    <div class="card-left">
                        <div class="image-placeholder"></div>
                        <div class="card-info">
                            <a href="combustivel.html"><h3>TANQUE</h3></a>

                        </div>
                    </div>
                    <a href="combustivel.html" class="btn-explore">Explorar</a>
