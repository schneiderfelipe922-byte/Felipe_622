<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boreal Executive Service - Entrar</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="page-wrapper">
        <header class="header-section">
            <div class="logo-container">
                <img src="Logo.png" width="190" height="190" alt="Logo Boreal">
                <span class="brand-subtitle">EXECUTIVE SERVICE</span>
            </div>
            
            <p class="header-description">
                Acesse sua conta para gerenciar voos, aeronaves e serviços exclusivos.
            </p>
        </header>

        <main class="card-section">
            <h2 class="form-title">ENTRAR</h2>
            <p class="form-subtitle">Bem-vindo de volta à Boreal.</p>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">SENHA</label>
                    <input type="password" id="password">
                </div>
                <nav>
                <a href="home.html"><button class="btn-submit">ENTRAR</a></button>
            </nav>
            </form>

            <div class="divider">
                <span>OU CONTINUE COM</span>
            </div>

            <div class="social-buttons">
                <button class="btn-social">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.28 21.4 7.37 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.6H1.25C.45 8.19 0 10.04 0 12s.45 3.81 1.25 5.4l4.03-3.13z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.28 2.6 1.25 6.6l4.03 3.13c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                </button>

                <button class="btn-social">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#000000">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 0.6-2.65 1.36-.58.68-1.09 1.76-.95 2.8 1.01.08 2.05-.56 2.68-1.31z"/>
                    </svg>
                </button>
            </div>

            <p class="signup-prompt">
                Não tem conta? <a href="Criar.html">Criar conta</a>
            </p>
        </main>
    </div>

</body>
</html>
